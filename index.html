const LOGO=new Image();LOGO.src='data:image/svg+xml;utf8,'+encodeURIComponent(document.querySelector('.logo svg').outerHTML);
function loop(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;if(tr<1)tr=Math.min(1,(n-trT0)/900);update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
log('✅','Office online · 25 agents at desks');PROJECTS.forEach(p=>log('📌',`<b>${p.title}</b> · ${p.status} · ${nm(p.owner)}`));
function pick(cx,cy){const r=cv.getBoundingClientRect(),mx=(cx-r.left-PX)/S,my=(cy-r.top-PY)/S;return ag.find(a=>a.vis&&Math.hypot(a.vx-mx,a.vy-my)<(26*a.vs)/Math.min(1,ZM)*Math.min(1,ZM)+6/ZM)||null}
function showCard(h,cx,cy){hover=h;if(!h){card.style.display='none';return}card.style.display='block';card.style.left=Math.max(8,Math.min(cx+16,innerWidth-260))+'px';card.style.top=Math.max(8,Math.min(cy+16,innerHeight-150))+'px';
 card.innerHTML=`<h3>${h.name}</h3><div class="m">${h.role} · ${Z[h.zone].name} · Floor ${Z[h.zone].floor}</div><div>Reports to: <b>${h.mgr}</b></div><div>Current task: ${h.task}</div><div class="m">Status: ${h.status}</div>`}
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,px:PANX,py:PANY,moved:false};
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:ZM};drag=null}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.z*d/pinch.d/ZM,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){PANX=drag.px+dx;PANY=drag.py+dy;applyView();card.style.display='none'}return}
 if(e.pointerType==='mouse')showCard(pick(e.clientX,e.clientY),e.clientX,e.clientY)});
const up=e=>{ptrs.delete(e.pointerId);if(drag&&!drag.moved&&e.type==='pointerup')showCard(pick(e.clientX,e.clientY),e.clientX,e.clientY);if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('mouseleave',()=>{if(!drag){hover=null;card.style.display='none'}});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
zi.onclick=()=>zoomAt(1.3,CW/2,CH/2);zo.onclick=()=>zoomAt(1/1.3,CW/2,CH/2);zr.onclick=()=>{ZM=1;PANX=PANY=0;applyView()};
</script></body></html>
